[project]
name = "ha-echo-presence-watchdog"
version = "0.1.0"
description = "Home Assistant package that alerts when Echo presence switches stop updating"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
